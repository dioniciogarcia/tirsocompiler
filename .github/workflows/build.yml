name: Build and Release

# Runs when the program changes on main, and by hand (Actions tab > Build and Release > Run workflow).
# Builds the Windows program with PyInstaller, makes the two installers and publishes a GitHub Release
# named after APP_VERSION (app/core/updater.py). The same version again replaces its release.
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'installer/**'
      - 'templates/**'
      - 'tools/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'README.txt'
      - '*.bat'
      - '.github/workflows/build.yml'
  workflow_dispatch:

concurrency:
  group: build-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write   # to create the Release
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the packages
        run: python -m pip install --disable-pip-version-check -r requirements.txt "pyinstaller>=6.10,<7"

      - name: Self-test
        run: python -m tests.run_tests

      - name: Updater tests
        run: python -m unittest tests.test_updater -v

      - name: Install Inno Setup (installer maker)
        run: choco install innosetup -y --no-progress

      - name: Build the program and the installers
        run: python installer/build_release.py

      - name: Publish the Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python installer/publish_release.py
